{% extends "reunions/base.html" %}
{% block title %}Supprimer le point{% endblock %}
{% block page_title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="panel">
    <p>Supprimer le point n° {{ point.numero }} : <strong>{{ point.sujet }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <div class="mt-4 d-flex gap-2 flex-wrap">
            <button class="btn btn-danger btn-lg" type="submit"><i class="bi bi-trash"></i> Supprimer</button>
            <a class="btn btn-secondary btn-lg" href="{% url 'reunion_detail' point.reunion_id %}"><i class="bi bi-arrow-left"></i> Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
