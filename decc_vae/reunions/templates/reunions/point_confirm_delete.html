{% extends "reunions/base.html" %}
{% block title %}Supprimer le point{% endblock %}
{% block page_title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="panel">
    <p>Supprimer le point n° {{ point.numero }} : <strong>{{ point.sujet }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-success" type="submit">Enregistrer la suppression</button>
        <a class="btn btn-secondary" href="{% url 'reunion_detail' point.reunion_id %}">Annuler</a>
    </form>
</div>
{% endblock %}
